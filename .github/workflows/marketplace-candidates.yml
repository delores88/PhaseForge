name: ALPHA marketplace candidates (no publication)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Native candidate / ${{ matrix.platform }} x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, platform: windows}
          - {runner: ubuntu-24.04, platform: linux}
    env:
      PHASEFORGE_RELEASE_ACCEPTANCE: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout the immutable dispatched commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22.23.2'}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13.15'}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with: {toolchain: '1.98.1'}
      - name: Linux desktop and native build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libssl-dev libfuse2t64 libopenjp2-tools xvfb dbus-x11 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libx11-xcb1 libdrm2 libgbm1 libasound2t64
          # The hosted runner allows user namespaces so Chromium's namespace sandbox can run.
          # The application is never launched with --no-sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install process inventory dependency
        run: python -m pip install psutil==7.2.2
      - name: Install pinned official evidence executables
        run: python scripts/release/install_tools.py --github-path
      - name: Install locked build-only evidence libraries
        run: npm ci --prefix scripts/release --ignore-scripts --no-audit --no-fund
      - name: Release binary, paths and provenance regressions
        run: node --test scripts/release/*.test.mjs
      - name: Release archive and pin regressions
        run: python -m unittest discover -s scripts/release -p "test_*.py"
      - name: Record clean source before building
        run: node scripts/release/source.mjs before
      - name: Test native science contracts
        run: cargo test --locked --all-targets
        working-directory: backend
      - name: Build native backend with compiler dependency metadata
        run: cargo auditable build --locked --release
        working-directory: backend
      - name: Dynamic owned-backend smoke against release binary (Linux)
        if: runner.os == 'Linux'
        run: node desktop/tests/dynamic-backend-smoke.cjs backend/target/release/phaseforge-backend
      - name: Dynamic owned-backend smoke against release binary (Windows)
        if: runner.os == 'Windows'
        run: node desktop/tests/dynamic-backend-smoke.cjs backend/target/release/phaseforge-backend.exe
      - name: Install locked frontend inputs
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Frontend scientific viewer regressions
        run: node --test frontend/tests/*.test.mjs
      - name: Build static frontend
        run: npm run build --prefix frontend
      - name: Install locked Electron wrapper inputs
        run: npm ci --prefix desktop --no-audit --no-fund
      - name: Electron security and lifecycle regressions
        run: npm test --prefix desktop
      - name: Stage native binary
        run: node scripts/stage-desktop.mjs
      - name: Bind staged binary and UI materials
        run: node scripts/release/materials.mjs
      - name: Package actual Windows x64 NSIS
        if: runner.os == 'Windows'
        run: npm run package:win:x64
        working-directory: desktop
      - name: Package actual Linux x64 AppImage
        if: runner.os == 'Linux'
        run: npm exec -- electron-builder --linux AppImage --x64 --publish never
        working-directory: desktop
      - name: Verify unchanged source after packaging
        run: node scripts/release/source.mjs after
      - name: Actual Windows install, offline results, restart, backup restore and uninstall
        if: runner.os == 'Windows'
        run: node scripts/release/native.mjs
      - name: Actual AppImage launch, offline results, restart, backup restore and removal
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x1000x24" dbus-run-session -- node scripts/release/native.mjs
      - name: Inspect exact installed payload and runtime observations
        run: node scripts/release/payload.mjs
      - name: Source and payload inventories, raw vulnerability and secret checks
        run: python scripts/release/scan.py
      - name: Assemble immutable candidate evidence
        run: python scripts/release/collect.py
      - name: Detached GitHub OIDC provenance and fresh-root verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/attest.mjs
      - name: Upload exact candidate installer and compact evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PhaseForge-ALPHA-${{ matrix.platform }}-x64-${{ github.sha }}
          path: .local/marketplace/${{ matrix.platform }}-x64/candidate/*
          include-hidden-files: true # Only the explicitly assembled files under the hidden .local directory.
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve failure evidence without publishing an incomplete candidate
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PhaseForge-ALPHA-failure-${{ matrix.platform }}-x64-${{ github.sha }}
          path: |
            .local/marketplace/source/*.json
            .local/marketplace/${{ matrix.platform }}-x64/*.json
            .local/marketplace/${{ matrix.platform }}-x64/launch-*/*.json
            .local/marketplace/${{ matrix.platform }}-x64/launch-*/*.png
            .local/marketplace/${{ matrix.platform }}-x64/checks/*
          include-hidden-files: true # Explicit diagnostic file patterns; no fixture databases or credentials.
          if-no-files-found: warn
          retention-days: 14
