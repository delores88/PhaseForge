[package]
name = "phaseforge-backend"
version = "0.10.0"
edition = "2021"
rust-version = "1.88"
authors = ["Ben Van Dorn"]
description = "Local-first computational discovery runtime for PhaseForge"
license = "MIT"

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:bytemuck"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
async-trait = "0.1"
axum = { version = "0.7.9", features = ["json", "macros", "ws"] }
bytemuck = { version = "1.16", features = ["derive"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
dotenvy = "0.15"
futures-util = "0.3"
hmac = "0.12"
keyring = "2.3"
parking_lot = "0.12"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
sysinfo = "0.30"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.8", features = ["serde", "v4"] }
wgpu = { version = "0.19.4", features = ["wgsl"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
approx = "0.5"
tempfile = "3.10"
